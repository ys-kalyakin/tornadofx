name: CI

on:
  push:
  pull_request:

jobs:
  test-headless:
    name: Default suite (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Run default test suite headless (Monocle)
        run: ./mvnw -B test -Pheadless

  quarantine:
    name: Quarantined tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Run quarantined tests headless (Monocle)
        run: ./mvnw -B test -Pheadless -Pquarantine
